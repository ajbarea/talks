<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051329"/>
      <stop offset="50%" stop-color="#0b1d3a"/>
      <stop offset="100%" stop-color="#102a54"/>
    </linearGradient>
    <radialGradient id="glow3" cx="72%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg3)"/>
  <rect width="1600" height="900" fill="url(#glow3)"/>

  <!-- Left: Typography -->
  <g transform="translate(140, 360)">
    <text x="0" y="0" font-family="'Atkinson Hyperlegible Next', system-ui, -apple-system, sans-serif" font-weight="800" font-size="78" fill="#f8fafc" letter-spacing="-0.03em">Federated</text>
    <text x="0" y="85" font-family="'Atkinson Hyperlegible Next', system-ui, -apple-system, sans-serif" font-weight="800" font-size="78" fill="#38bdf8" letter-spacing="-0.03em">Agents</text>
    <text x="0" y="170" font-family="'Atkinson Hyperlegible Next', system-ui, -apple-system, sans-serif" font-weight="500" font-size="32" fill="#93c5fd" letter-spacing="-0.01em">Collaborative AI without Sharing Code</text>
    <text x="0" y="240" font-family="'Atkinson Hyperlegible Next', system-ui, -apple-system, sans-serif" font-weight="600" font-size="24" fill="#38bdf8" opacity="0.9" letter-spacing="0.05em">AJ BAREA · ROCHESTER INSTITUTE OF TECHNOLOGY</text>
  </g>

  <!-- Right: Federated Architecture Motif -->
  <g transform="translate(900, 190)" filter="url(#shadow3)">
    <!-- Silo 1 (Left Enterprise) -->
    <rect x="20" y="60" width="220" height="360" rx="20" fill="#0f172a" stroke="#1e293b" stroke-width="4"/>
    <text x="130" y="105" font-family="'Atkinson Hyperlegible Next', sans-serif" font-size="18" font-weight="700" fill="#64748b" text-anchor="middle" letter-spacing="0.05em">CLIENT A</text>
    <!-- Private weight block -->
    <rect x="44" y="130" width="80" height="100" rx="12" fill="#be123c"/>
    <text x="84" y="185" font-family="'Atkinson Hyperlegible Next', sans-serif" font-size="14" font-weight="700" fill="#ffe4e6" text-anchor="middle">Private</text>
    <!-- Shared adapter block -->
    <rect x="136" y="130" width="80" height="100" rx="12" fill="#0284c7"/>
    <text x="176" y="185" font-family="'Atkinson Hyperlegible Next', sans-serif" font-size="14" font-weight="700" fill="#f0f9ff" text-anchor="middle">Shared</text>
    <!-- Base model foundation -->
    <rect x="44" y="250" width="172" height="140" rx="12" fill="#1e293b"/>
    <text x="130" y="325" font-family="'Atkinson Hyperlegible Next', sans-serif" font-size="16" font-weight="700" fill="#94a3b8" text-anchor="middle">Frozen Base Model</text>

    <!-- Silo 2 (Right Enterprise) -->
    <rect x="360" y="60" width="220" height="360" rx="20" fill="#0f172a" stroke="#1e293b" stroke-width="4"/>
    <text x="470" y="105" font-family="'Atkinson Hyperlegible Next', sans-serif" font-size="18" font-weight="700" fill="#64748b" text-anchor="middle" letter-spacing="0.05em">CLIENT B</text>
    <!-- Shared adapter block -->
    <rect x="384" y="130" width="80" height="100" rx="12" fill="#0284c7"/>
    <text x="424" y="185" font-family="'Atkinson Hyperlegible Next', sans-serif" font-size="14" font-weight="700" fill="#f0f9ff" text-anchor="middle">Shared</text>
    <!-- Private weight block -->
    <rect x="476" y="130" width="80" height="100" rx="12" fill="#be123c"/>
    <text x="516" y="185" font-family="'Atkinson Hyperlegible Next', sans-serif" font-size="14" font-weight="700" fill="#ffe4e6" text-anchor="middle">Private</text>
    <!-- Base model foundation -->
    <rect x="384" y="250" width="172" height="140" rx="12" fill="#1e293b"/>
    <text x="470" y="325" font-family="'Atkinson Hyperlegible Next', sans-serif" font-size="16" font-weight="700" fill="#94a3b8" text-anchor="middle">Frozen Base Model</text>

    <!-- Aggregator Server Nexus -->
    <rect x="254" y="100" width="92" height="80" rx="16" fill="#0284c7" stroke="#38bdf8" stroke-width="4"/>
    <circle cx="300" cy="130" r="10" fill="#f8fafc"/>
    <text x="300" y="165" font-family="'Atkinson Hyperlegible Next', sans-serif" font-size="13" font-weight="800" fill="#f0f9ff" text-anchor="middle">SERVER</text>

    <!-- Federated synchronization links -->
    <path d="M216 180 L254 140" stroke="#38bdf8" stroke-width="5" stroke-dasharray="8 6"/>
    <path d="M384 180 L346 140" stroke="#38bdf8" stroke-width="5" stroke-dasharray="8 6"/>
  </g>
</svg>
