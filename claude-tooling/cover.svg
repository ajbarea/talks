<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f0c"/>
      <stop offset="50%" stop-color="#1c1410"/>
      <stop offset="100%" stop-color="#261b14"/>
    </linearGradient>
    <radialGradient id="glow2" cx="72%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg2)"/>
  <rect width="1600" height="900" fill="url(#glow2)"/>

  <!-- Left: Typography -->
  <g transform="translate(140, 360)">
    <text x="0" y="0" font-family="'Atkinson Hyperlegible Next', system-ui, -apple-system, sans-serif" font-weight="800" font-size="76" fill="#f8fafc" letter-spacing="-0.03em">Five Claude Apps,</text>
    <text x="0" y="85" font-family="'Atkinson Hyperlegible Next', system-ui, -apple-system, sans-serif" font-weight="800" font-size="76" fill="#f97316" letter-spacing="-0.03em">One Favorite</text>
    <text x="0" y="170" font-family="'Atkinson Hyperlegible Next', system-ui, -apple-system, sans-serif" font-weight="500" font-size="32" fill="#d4d4d8" letter-spacing="-0.01em">Agentic Workflows with Claude Code</text>
    <text x="0" y="240" font-family="'Atkinson Hyperlegible Next', system-ui, -apple-system, sans-serif" font-weight="600" font-size="24" fill="#fb923c" opacity="0.9" letter-spacing="0.05em">AJ BAREA · LDQIS LAB</text>
  </g>

  <!-- Right: Dancing Robot Motif -->
  <g transform="translate(1000, 160)" filter="url(#shadow2)">
    <!-- Halo glow -->
    <circle cx="210" cy="270" r="180" fill="none" stroke="#f97316" stroke-width="4" stroke-dasharray="16 12" opacity="0.4"/>
    <ellipse cx="210" cy="510" rx="110" ry="16" fill="#000000" opacity="0.5"/>

    <!-- Musical notes -->
    <path d="M70 180 a14 14 0 1 0 18 -6 v-50 l24 -8 v14 l-15 5 z" fill="#f97316" opacity="0.8"/>
    <path d="M330 150 a14 14 0 1 0 18 -6 v-50 l24 -8 v14 l-15 5 z" fill="#f97316" opacity="0.8"/>

    <!-- Robot Legs -->
    <rect x="160" y="390" width="34" height="85" rx="14" fill="#ea580c"/>
    <rect x="142" y="460" width="60" height="25" rx="12" fill="#c2410c"/>
    <rect x="226" y="390" width="34" height="85" rx="14" fill="#ea580c"/>
    <rect x="218" y="460" width="60" height="25" rx="12" fill="#c2410c"/>

    <!-- Robot Body -->
    <rect x="130" y="230" width="160" height="175" rx="36" fill="#f97316"/>
    <!-- Chest Panel -->
    <rect x="162" y="275" width="96" height="62" rx="16" fill="#292524"/>
    <circle cx="186" cy="306" r="9" fill="#22c55e"/>
    <circle cx="210" cy="306" r="9" fill="#eab308"/>
    <circle cx="234" cy="306" r="9" fill="#3b82f6"/>

    <!-- Robot Arms -->
    <g transform="rotate(-20 80 260)">
      <rect x="40" y="250" width="80" height="28" rx="14" fill="#ea580c"/>
      <circle cx="45" cy="264" r="22" fill="#c2410c"/>
    </g>
    <g transform="rotate(25 340 260)">
      <rect x="300" y="250" width="80" height="28" rx="14" fill="#ea580c"/>
      <circle cx="375" cy="264" r="22" fill="#c2410c"/>
    </g>

    <!-- Head -->
    <line x1="210" y1="90" x2="210" y2="50" stroke="#f97316" stroke-width="8" stroke-linecap="round"/>
    <circle cx="210" cy="42" r="16" fill="#fbbf24"/>
    <rect x="105" y="80" width="210" height="150" rx="48" fill="#f97316"/>
    <!-- Face Screen -->
    <rect x="132" y="108" width="156" height="96" rx="30" fill="#1c1917"/>
    <circle cx="176" cy="150" r="14" fill="#fbbf24"/>
    <circle cx="244" cy="150" r="14" fill="#fbbf24"/>
    <path d="M185 178 q25 18 50 0" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
