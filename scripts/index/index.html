<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Talks by AJ Barea</title>
  <meta name="description"
    content="Research talks by AJ Barea: open one in your browser, or download it as PowerPoint or PDF.">
  <meta property="og:title" content="Talks by AJ Barea">
  <meta property="og:description"
    content="Research talks: open one in your browser, or download it as PowerPoint or PDF.">
  <script>
    document.documentElement.classList.add("flow");
    (() => {
      const saved = localStorage.getItem("talks-theme");
      if (saved === "light" || saved === "dark") {
        document.documentElement.setAttribute("data-theme", saved);
      }
    })();
  </script>
  <style>
/* index.css */
  </style>
</head>
<body>
<main>
  <header>
    <div class="header-main">
      <div class="brand-row">
        <a class="brand-link" href="https://ajbarea.github.io/">AJ Barea</a>
        <span class="sep" aria-hidden="true">·</span>
        <h1>Talks</h1>
      </div>
      <p class="tagline">Research talks: open one in your browser, or download as PowerPoint or PDF.</p>
    </div>
    <div class="header-actions">
      <button class="theme-toggle" type="button" aria-label="Switch to dark theme" title="Toggle light/dark theme">
        <svg class="icon-sun" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
        <svg class="icon-moon" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
        </svg>
      </button>
    </div>
  </header>
  <p id="carousel-help" class="sr-only">Use arrow keys, swipe or click to navigate between talks. Activate the centered cover to open the deck.</p>
  <section class="talks" id="talks" aria-label="Talks" aria-describedby="carousel-help">
    <div class="stage">
      <button class="step prev" type="button" aria-label="Previous talk" hidden>
        <svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
          stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button class="step next" type="button" aria-label="Next talk" hidden>
        <svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
          stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      <div class="covers">
<!-- talks -->
      </div>
      <div class="dots" aria-hidden="true" hidden></div>
    </div>
    <p class="sr-only" aria-live="polite" aria-atomic="true"></p>
  </section>
</main>
<script>
/* index.js */
</script>
</body>
</html>
