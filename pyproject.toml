[project]
name = "talks"
version = "0"
description = "Research talks as interactive web decks"
requires-python = ">=3.12"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".deps", "_site"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
