[project]
name = "talks"
version = "0"
description = "Research talks as interactive web decks"
requires-python = ">=3.12"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pillow>=12.0",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "segno>=1.6.6",
    "zxing-cpp>=3.1.1",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".deps", "_site", "_exports"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "G", "LOG"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
