# Checks every talk and publishes them all as one GitHub Pages site, each at /<folder>/.
#
# A talk's figures come from another repository (sphragis, for Federated Agents), so a change
# that makes them stale produces no event here: the daily run is what catches it. A failed run
# publishes nothing, and the site keeps its last good version.
name: Site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      # ruff prints its findings as annotations on the PR's changed lines; `make lint` stays the
      # same command locally.
      RUFF_OUTPUT_FORMAT: github
      SPHRAGIS: ${{ github.workspace }}/.deps/sphragis
    steps:
      - name: Check out the talks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out sphragis, where the Federated Agents figures come from
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ajbarea/sphragis
          path: .deps/sphragis
          persist-credentials: false

      - name: Check out techne, for the graphe:slides gates
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ajbarea/techne
          # Pinned, so a new gate in techne cannot stop the site publishing unannounced.
          # Dependabot does not bump this; move it by hand when graphe:slides changes.
          # techne 1.5.0 (#175).
          ref: 0eb543dcfc21f27abfe886679a43d73b10b7a04c
          path: .deps/techne
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          download-from-astral-mirror: false
          prune-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Check every talk's figures against their artifacts
        run: make figures-check

      - name: Check every talk's QR codes
        run: make qr-check

      - name: Install Chromium for the slide gates
        run: uv run --no-project --quiet --with playwright==1.63.0 playwright install --with-deps chromium

      - name: Run the slide gates on every talk
        run: make slides-check SLIDES=.deps/techne/plugins/graphe/skills/slides/scripts/slides.py

      - name: Export every talk for PowerPoint and as a PDF, with its preview
        run: make exports SLIDES=.deps/techne/plugins/graphe/skills/slides/scripts/slides.py

      - name: Lay out the site
        run: python3 scripts/site.py _site --exports _exports

      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
