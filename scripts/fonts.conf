<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  The slide gates measure text, so whether a slide fits depends on the font. The decks name a
  system font stack, which each Linux machine resolves to its own font: CI's runner draws DejaVu
  Sans, other machines something narrower, and a slide that fits there clips in CI. This conf
  hides every font but DejaVu, so any family a deck or reveal.js names resolves to it. `make`
  passes it to the gates, renders and exports through FONTCONFIG_FILE; Chromium reads fontconfig
  on Linux only. `make fonts` fails when DejaVu is not what this conf resolves.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <selectfont>
    <rejectfont><pattern/></rejectfont>
    <acceptfont>
      <pattern><patelt name="family"><string>DejaVu Sans</string></patelt></pattern>
      <pattern><patelt name="family"><string>DejaVu Sans Mono</string></patelt></pattern>
      <pattern><patelt name="family"><string>DejaVu Serif</string></patelt></pattern>
    </acceptfont>
  </selectfont>
</fontconfig>
